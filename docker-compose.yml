services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: esg_platform
      POSTGRES_USER: esg_platform
      POSTGRES_PASSWORD: esg_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: esg_platform.settings.development
      DJANGO_SECRET_KEY: development-only-change-me
      POSTGRES_DB: esg_platform
      POSTGRES_USER: esg_platform
      POSTGRES_PASSWORD: esg_platform
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
