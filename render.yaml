services:
  - type: web
    name: esg-platform-backend
    env: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: esg_platform.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: POSTGRES_DB
        fromDatabase:
          name: esg-platform-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: esg-platform-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: esg-platform-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: esg-platform-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: esg-platform-db
          property: port
databases:
  - name: esg-platform-db
    plan: starter
